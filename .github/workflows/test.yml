name: Inline parent review functional QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-functional-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: product
    env:
      GBRAIN_CI_BUN_TAG: contribution-1.4.4-curl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          repository: tarush1989/gbrain
          ref: ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gstack
          ref: 8781d9c0a972068e2ee0e5597eb2f3482788355a
          path: qa-tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Bind exact source and pinned base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git fetch origin 333dd1bdcd47d70808a82fb52d2f493fea460b17:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = 333dd1bdcd47d70808a82fb52d2f493fea460b17
          test -z "$(git status --porcelain)"
          sha256sum src/commands/autopilot-daemon.ts test/autopilot-inline-source-freshness.serial.test.ts src/core/cycle.ts
          git show 333dd1bdcd47d70808a82fb52d2f493fea460b17:src/commands/autopilot-daemon.ts | sha256sum
          test "$(id -u)" = 1001
      - name: Prepare disposable native runner (no databases, no credentials)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-build-context" "$RUNNER_TEMP/native-results"
          chmod 0777 "$RUNNER_TEMP/native-results"
          docker build -t oven/bun:contribution-1.4.4-curl -f - "$RUNNER_TEMP/empty-build-context" <<'DOCKERFILE'
          FROM oven/bun:1.4.4
          USER root
          RUN apt-get update -qq && apt-get install -y -qq git ca-certificates python3 procps postgresql-client jq build-essential curl
          RUN groupadd --gid 1001 ci-test && useradd --uid 1001 --gid 1001 --create-home ci-test
          DOCKERFILE
          docker compose -f docker-compose.ci.yml run --rm --no-deps runner bash -ec '
            git config --global --add safe.directory "*"
            bash scripts/ci-hydrate-admin-dist.sh /ci-src/admin-dist admin/dist
            bun install --frozen-lockfile
            bun run build
            bun run build:pglite-snapshot
            chown -R 1001:1001 /app
          '
      - name: One native recorder-backed functional smoke as UID1001
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/native-qa.sh" <<'NATIVE_QA'
          set -euo pipefail
          umask 077
          export HOME=/home/ci-test
          git config --global --add safe.directory "*"
          test "$(id -u)" = 1001
          test "$(git rev-parse HEAD)" = ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7
          test -z "$(git status --porcelain)"
          export GBRAIN_SKIP_STARTUP_HOOKS=1 GBRAIN_PGLITE_SNAPSHOT=test/fixtures/pglite-snapshot.tar
          unset DATABASE_URL GBRAIN_DATABASE_URL
          P=/ci-results/probe
          mkdir -m 0700 "$P" /ci-results/native
          export GBRAIN_TEST_RECEIPT_DIR=/ci-results/native
          cat > "$P/charter.md" <<'CHARTER'
          # Native inline daemon smoke
          Caller: existing code-only /review parent-owned dispatch; REVIEW_START eae394a0-a4fe-4683-9c48-f6dbc6b36605, continuation6510b792-3f8a-423f-8531-affb03eb59c2; functional CLI, one probe, 300 seconds.
          Source: ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7; gstack8781d9c0.
          Contract/risk: inline registered source freshness and full maintenance, unmatched repo no-effect, normal daemon shutdown; prevent wrong stamps or narrowed maintenance.
          Entrypoint/inputs: bash scripts/run-serial-tests.sh test/autopilot-inline-source-freshness.serial.test.ts; unchanged public fixture.
          Isolation: owned disposable UID1001 container; synthetic temporary HOME/PGLite repos; no live credentials/DB/provider. Existing test owns fixture cleanup.
          Exit: one probe completes or 300 seconds, no further probe/source edit.
          Limits: no live providers, Postgres contention, in-flight resolution cancellation, additional default/archived/ambiguous registration or busy-lock cases, or production nightly proof. Prior negative controls separate, never backfilled.
          CHARTER
          sha256sum src/commands/autopilot-daemon.ts test/autopilot-inline-source-freshness.serial.test.ts src/core/cycle.ts > "$P/source.sha256"
          export GSTACK_QA_REQUIRED_PROBES='["bash scripts/run-serial-tests.sh test/autopilot-inline-source-freshness.serial.test.ts"]'
          bun /gstack/bin/gstack-qa-deadline start "$P/deadline.json" 300
          set +e
          bun /gstack/bin/gstack-qa-evidence capture "$P" 001 --public --deadline "$P/deadline.json" -- bash scripts/run-serial-tests.sh test/autopilot-inline-source-freshness.serial.test.ts > "$P/capture-result.json"
          rc=$?
          set -e
          cat "$P/capture-result.json"
          python3 - <<'CHECK'
          import json,pathlib
          p=pathlib.Path('/ci-results/probe');r=json.loads((p/'.qa-evidence/001/receipt.json').read_text());assert r['status']=='complete'
          print(json.dumps({'safe_observation':json.loads((p/'.qa-evidence/001/observation.json').read_text())}))
          a={'evidence':[{'capture':'001','command':'bash scripts/run-serial-tests.sh test/autopilot-inline-source-freshness.serial.test.ts','contract':'Inline registered-source freshness, full maintenance, unmatched no-effect, normal shutdown','expected':'Exit0; registered source stamps set; stale clone removed; unmatched stamps unchanged; 16 assertions pass','classification':'pass' if r['exitCode']==0 else 'fail'}],'limits':['One smoke; no next probe so no checkpoint.','Live providers, Postgres contention, in-flight lookup cancellation and other registration/lock cases not tested.','Not production nightly proof; documentation and full-corpus holds separate.']}
          f=p/'annotations.json';f.write_text(json.dumps(a,indent=2)+'\n');f.chmod(0o600)
          CHECK
          bun /gstack/bin/gstack-qa-evidence materialize "$P" "$P/annotations.json" > "$P/materialize-result.json"
          cat "$P/materialize-result.json"
          python3 - <<'REPORT'
          import json,pathlib,xml.etree.ElementTree as E
          p=pathlib.Path('/ci-results/probe');v=json.loads((p/'evidence.json').read_text());r=json.loads((p/'.qa-evidence/001/receipt.json').read_text())
          f=list(pathlib.Path('/ci-results/native').glob('*.junit.xml'));assert f
          ss=[s for x in f for s in E.parse(x).getroot().iter('testsuite')];t={k:sum(int(s.attrib.get(k,0))for s in ss)for k in ['tests','assertions','failures','errors','skipped']}
          text='# Functional QA Report: inline source freshness\n\nRevision ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7, unchanged source. Caller: existing code-only /review; owned fixture/report writes only. One probe / 300 seconds. Bun1.4.4; pinned gstack8781d9c0.\n\n## Contract outcomes\n\nRegistered source stamps, full maintenance stale-clone deletion, unmatched repo no-effect and normal shutdown asserted by unchanged native test. Exact command: bash scripts/run-serial-tests.sh test/autopilot-inline-source-freshness.serial.test.ts. [Native evidence](evidence.json).\n\nObserved JUnit '+json.dumps(t)+'; child exit '+str(r['exitCode'])+'; verdict '+json.dumps(v['verdict'])+'. Exact stdout/stderr and guarded timing retained in .qa-evidence/001.\n\n## Findings and permanent tests\n\nExisting permanent regression exercised; no source edits. One capture, no next probe and no checkpoint. Prior negative controls remain separate evidence.\n\n## Coverage limits and cleanup\n\nDisposable UID1001 synthetic HOME/PGLite; no production destinations. Test cleans owned temporary fixtures/child; workflow stops disposable stack. Live providers, Postgres contention, in-flight cancellation and additional registration/lock cases not tested. No production nightly proof or documentation-hold closure. Reports retained in log.\n'
          f=p/'functional-report.md';f.write_text(text);f.chmod(0o600)
          assert v['verdict']['status']=='pass' and not v['verdict']['open'] and r['exitCode']==0
          assert t['tests']==1 and t['assertions']==16 and t['failures']==t['errors']==0
          print(json.dumps({'verdict':v['verdict'],'junit':t}))
          REPORT
          test "$rc" = 0
          test -z "$(git status --porcelain)"
          NATIVE_QA
          docker compose -f docker-compose.ci.yml run --rm --no-deps --user 1001:1001 \
            -e CI=true -e GITHUB_SHA=ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7 -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v "$RUNNER_TEMP/native-qa.sh:/native-qa.sh:ro" \
            -v "$GITHUB_WORKSPACE/qa-tooling:/gstack:ro" \
            -v "$RUNNER_TEMP/native-results:/ci-results" \
            runner bash /native-qa.sh
      - name: Preserve receipts in job log without artifact or cache uploads
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-results"
          ls -la
          tar -czf "$RUNNER_TEMP/native-qa-receipts.tar.gz" .
          sha256sum "$RUNNER_TEMP/native-qa-receipts.tar.gz"
          echo "NATIVE_QA_RECEIPTS_BASE64_BEGIN"
          base64 -w 100 "$RUNNER_TEMP/native-qa-receipts.tar.gz"
          echo "NATIVE_QA_RECEIPTS_BASE64_END"
      - name: Stop only this disposable stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
