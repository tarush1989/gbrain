name: Inline cycle failed-file environment comparison (diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failed-file-environment:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - revision: baseline
            product_sha: a131fb20ef4aafd017f0c6a6565ce5627dc46897
            uid: '0'
          - revision: baseline
            product_sha: a131fb20ef4aafd017f0c6a6565ce5627dc46897
            uid: '1001'
          - revision: candidate
            product_sha: ce0e2b76e6cadc83645c6547e64d867bd2013cc2
            uid: '0'
          - revision: candidate
            product_sha: ce0e2b76e6cadc83645c6547e64d867bd2013cc2
            uid: '1001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GBRAIN_CI_BUN_TAG: contribution-1.4.4-curl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tarush1989/gbrain
          ref: ${{ matrix.product_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify exact product source and comparison base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.product_sha }}"
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git fetch origin a131fb20ef4aafd017f0c6a6565ce5627dc46897:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = a131fb20ef4aafd017f0c6a6565ce5627dc46897
          git status --short
          test "$(id -u)" = 1001
          nproc
          free -m
      - name: Install existing pinned gitleaks CLI
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          mkdir -p "$RUNNER_TEMP/gitleaks-dl"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks-dl/${BASE}" "${URL}/${BASE}"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_checksums.txt" "${URL}/gitleaks_${VER}_checksums.txt"
          ( cd "$RUNNER_TEMP/gitleaks-dl" && grep " ${BASE}\$" "$RUNNER_TEMP/gitleaks_checksums.txt" | sha256sum -c - )
          tar -xzf "$RUNNER_TEMP/gitleaks-dl/${BASE}" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Prepare the test container's required tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-build-context"
          docker build -t oven/bun:contribution-1.4.4-curl -f - "$RUNNER_TEMP/empty-build-context" <<'DOCKERFILE'
          FROM oven/bun:1.4.4
          USER root
          RUN apt-get update -qq && apt-get install -y -qq git ca-certificates python3 procps postgresql-client jq build-essential curl
          RUN groupadd --gid 1001 ci-test && useradd --uid 1001 --gid 1001 --create-home ci-test
          DOCKERFILE
          docker compose -f docker-compose.ci.yml pull postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
      - name: Prepare identical native tools and snapshot before selecting the test UID
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/failure-results"
          chmod 0777 "$RUNNER_TEMP/failure-results"
          docker compose -f docker-compose.ci.yml up -d postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
          docker compose -f docker-compose.ci.yml run --rm runner bash -ec '
            git config --global --add safe.directory "*"
            bash scripts/ci-hydrate-admin-dist.sh /ci-src/admin-dist admin/dist
            bun install --frozen-lockfile
            bun run build
            bun run build:pglite-snapshot
            id ci-test
            chown -R 1001:1001 /app
          '
      - name: Compare only eight failed files, ten counted trials; never a full-suite green
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/failure-native.sh" <<'NATIVE_FAILURES'
          set -euo pipefail
          export HOME=/tmp/ci-failure-outer-home
          mkdir -p "$HOME"
          git config --global --add safe.directory '*'
          id
          git update-index --refresh
          git status --short
          # Forced probe: same chmod000 object, root can still read; unprivileged UID1001 cannot.
          python3 - <<'PROBE'
          import os,tempfile,pathlib,json,subprocess
          folder=pathlib.Path(tempfile.mkdtemp(prefix='permission-probe-'))
          file=folder/'mode000';file.write_text('synthetic');file.chmod(0)
          outcomes=[]
          for trial in range(10):
              try:file.read_text();outcomes.append('readable')
              except PermissionError:outcomes.append('permission_denied')
          file.chmod(0o600);file.unlink();folder.rmdir()
          print(json.dumps({'diagnostic':'permission_probe','uid':os.getuid(),'trials':outcomes}))
          isolated=pathlib.Path(tempfile.mkdtemp(prefix='git-home-probe-'))
          env=dict(os.environ,HOME=str(isolated))
          result=subprocess.run(['git','status','--porcelain'],env=env,text=True,capture_output=True)
          print(json.dumps({'diagnostic':'isolated_home_git','uid':os.getuid(),'exit_code':result.returncode,'stderr':result.stderr}))
          isolated.rmdir()
          PROBE
          export GBRAIN_PGLITE_SNAPSHOT=test/fixtures/pglite-snapshot.tar
          export GBRAIN_TEST_TIMEOUT_MULTIPLIER=6
          for trial in $(seq 1 10); do
            export GBRAIN_TEST_RECEIPT_DIR="/ci-results/trial-${trial}"
            set +e
            env -u DATABASE_URL -u GBRAIN_DATABASE_URL bash scripts/run-unit-shard.sh \
              test/persistence-worktree-refresh.test.ts \
              test/doctor-content-golden.test.ts \
              test/cycle/concept-publication-file-recheck.test.ts \
              test/doctor-hot-checks-golden.test.ts \
              test/doctor-json-golden.test.ts \
              test/sync-unreadable-file-gbra130.test.ts \
              test/scripts/e2e-runner.test.ts \
              test/doctor-not-verified-5432.test.ts \
              2>&1 | tee "/ci-results/trial-${trial}.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            python3 - "$trial" "${codes[0]}" "${codes[1]}" <<'RECEIPT'
          import sys,json,pathlib,os
          row={'trial':int(sys.argv[1]),'uid':os.getuid(),'native_exit':int(sys.argv[2]),'tee_exit':int(sys.argv[3]),'diagnostic_only':True,'full_suite_gate':False}
          with pathlib.Path('/ci-results/trials.jsonl').open('a') as file:file.write(json.dumps(row)+'\n')
          print(json.dumps(row))
          RECEIPT
            test "${codes[1]}" -eq 0
            # Ordinary failures are measured, never retried to get a green gate.
            # Infrastructure/usage failures stop this diagnostic and preserve partials.
            test "${codes[0]}" -le 1
          done
          NATIVE_FAILURES
          docker compose -f docker-compose.ci.yml run --rm \
            --user "${{ matrix.uid }}:${{ matrix.uid }}" \
            -e CI='true' -e GITHUB_SHA="${{ matrix.product_sha }}" \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v "$RUNNER_TEMP/failure-native.sh:/failure-native.sh:ro" \
            -v "$RUNNER_TEMP/failure-results:/ci-results" \
            runner bash /failure-native.sh 2>&1 | tee "$RUNNER_TEMP/failure-results/native-comparison.log"
      - name: Retain explicit synthetic diagnostic results and native receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-files-${{ matrix.revision }}-uid${{ matrix.uid }}-${{ github.run_id }}
          path: ${{ runner.temp }}/failure-results/
          retention-days: 7
          if-no-files-found: error
      - name: Stop only this disposable test stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
