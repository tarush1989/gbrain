name: Robot pooler topology controlled comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  robot-pooler-topology:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source:
          - name: upstream
            sha: a131fb20ef4aafd017f0c6a6565ce5627dc46897
          - name: candidate
            sha: ce0e2b76e6cadc83645c6547e64d867bd2013cc2
        topology: [mismatched, colocated]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GBRAIN_CI_BUN_TAG: contribution-1.4.4-curl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tarush1989/gbrain
          ref: ${{ matrix.source.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify exact product source and comparison base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.source.sha }}"
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git status --short
          test "$(id -u)" = 1001
          nproc
          free -m
      - name: Install existing pinned gitleaks CLI
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          mkdir -p "$RUNNER_TEMP/gitleaks-dl"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks-dl/${BASE}" "${URL}/${BASE}"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_checksums.txt" "${URL}/gitleaks_${VER}_checksums.txt"
          ( cd "$RUNNER_TEMP/gitleaks-dl" && grep " ${BASE}\$" "$RUNNER_TEMP/gitleaks_checksums.txt" | sha256sum -c - )
          tar -xzf "$RUNNER_TEMP/gitleaks-dl/${BASE}" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Prepare the test container's required tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-build-context"
          docker build -t oven/bun:contribution-1.4.4-curl -f - "$RUNNER_TEMP/empty-build-context" <<'DOCKERFILE'
          FROM oven/bun:1.4.4
          USER root
          RUN apt-get update -qq && apt-get install -y -qq git ca-certificates python3 procps postgresql-client jq build-essential curl
          RUN groupadd --gid 1001 ci-test && useradd --uid 1001 --gid 1001 --create-home ci-test
          DOCKERFILE
          docker compose -f docker-compose.ci.yml pull postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
      - name: Prepare identical native tools and snapshot before selecting the test UID
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/facts-results"
          chmod 0777 "$RUNNER_TEMP/facts-results"
          docker compose -f docker-compose.ci.yml up -d postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
          docker compose -f docker-compose.ci.yml run --rm runner bash -ec '
            git config --global --add safe.directory "*"
            bash scripts/ci-hydrate-admin-dist.sh /ci-src/admin-dist admin/dist
            bun install --frozen-lockfile
            bun run build
            bun run build:pglite-snapshot
            bun scripts/lib/ensure-e2e-database.ts postgresql://postgres:postgres@postgres-1:5432/gbrain_test gbrain_ci_admin_test
            id ci-test
            chown -R 1001:1001 /app
          '
      - name: Count ten native trials and a forced topology probe
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/topology-native.sh" <<'NATIVE_TOPOLOGY'
          set -euo pipefail
          export HOME=/tmp/native-topology-outer-home
          mkdir -p "$HOME"
          test "$(id -u)" = 1001
          test "$(git rev-parse HEAD)" = "$CI_PRODUCT_SHA"
          export GBRAIN_SKIP_STARTUP_HOOKS=1
          ./bin/gbrain --version
          export GBRAIN_PGLITE_SNAPSHOT=test/fixtures/pglite-snapshot.tar
          export GBRAIN_TEST_TIMEOUT_MULTIPLIER=6
          case "$CI_TOPOLOGY" in
            mismatched) direct_host=postgres-2 ;;
            colocated) direct_host=postgres-1 ;;
            *) exit 2 ;;
          esac
          export DATABASE_URL="postgresql://postgres:postgres@${direct_host}:5432/gbrain_test"
          export GBRAIN_PGBOUNCER_URL=postgresql://postgres:postgres@pgbouncer:5432/gbrain_pgbouncer_test
          export GBRAIN_PGBOUNCER_DIRECT_URL=postgresql://postgres:postgres@postgres-1:5432/gbrain_ci_admin_test
          export GBRAIN_PGBOUNCER_E2E_DB=gbrain_robot_topology_test
          export GBRAIN_CI_REQUIRE_PGBOUNCER=1 GBRAIN_TEST_DB=1
          probe_db="gbrain_topology_probe_test_$(python3 -c 'import uuid;print(uuid.uuid4().hex)')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $probe_db"
          direct_count=$(psql "$DATABASE_URL" -At -c "SELECT count(*) FROM pg_database WHERE datname='$probe_db'")
          pooler_host_count=$(psql "$GBRAIN_PGBOUNCER_DIRECT_URL" -At -c "SELECT count(*) FROM pg_database WHERE datname='$probe_db'")
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE $probe_db"
          printf '{"topology":"%s","direct_database_count":%s,"pooler_host_database_count":%s}\n' "$CI_TOPOLOGY" "$direct_count" "$pooler_host_count" | tee /ci-results/forced-probe.json
          # Every trial is counted. Nonzero native exits are retained, never retried
          # as a way to turn the suite green. This job collects diagnostics only.
          for trial in $(seq 1 10); do
            export GBRAIN_TEST_RECEIPT_DIR="/ci-results/native-receipts/trial-${trial}"
            set +e
            bash scripts/run-e2e.sh test/e2e/persistence-robot-fixture-release.test.ts > "/ci-results/trial-${trial}.log" 2>&1
            native_rc=$?
            set -e
            printf '{"trial":%s,"native_exit":%s}\n' "$trial" "$native_rc" | tee -a /ci-results/trials.jsonl
          done
          NATIVE_TOPOLOGY
          docker compose -f docker-compose.ci.yml run --rm \
            --user 1001:1001 \
            -e CI='true' -e CI_TOPOLOGY="${{ matrix.topology }}" \
            -e CI_PRODUCT_SHA="${{ matrix.source.sha }}" \
            -e GITHUB_SHA="${{ matrix.source.sha }}" \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v "$RUNNER_TEMP/topology-native.sh:/topology-native.sh:ro" \
            -v "$RUNNER_TEMP/facts-results:/ci-results" \
            runner bash /topology-native.sh 2>&1 | tee "$RUNNER_TEMP/facts-results/collection.log"
      - name: Retain explicit synthetic diagnostic results and native receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-topology-${{ matrix.source.name }}-${{ matrix.topology }}-${{ github.run_id }}
          path: ${{ runner.temp }}/facts-results/
          retention-days: 7
          if-no-files-found: error
      - name: Stop only this disposable test stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
