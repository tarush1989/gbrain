name: Inline source daemon guarded QA smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lane:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { lane: qa, shard: 0 }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GBRAIN_CI_BUN_TAG: contribution-1.4.4-curl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tarush1989/gbrain
          ref: 31c5a41ba9103590f2c2922434b8f15c9b55f380
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Bind exact integrated product and upstream comparison
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 31c5a41ba9103590f2c2922434b8f15c9b55f380
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git fetch origin 46a6fd758b30314da475339df1f473056b80e956:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = 46a6fd758b30314da475339df1f473056b80e956
          test -z "$(git status --porcelain)"
          git diff origin/master --stat
          test "$(id -u)" = 1001
          nproc
          free -m
      - name: Install pinned native secret scanner
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          mkdir -p "$RUNNER_TEMP/gitleaks-dl"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks-dl/${BASE}" "${URL}/${BASE}"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_checksums.txt" "${URL}/gitleaks_${VER}_checksums.txt"
          ( cd "$RUNNER_TEMP/gitleaks-dl" && grep " ${BASE}\$" "$RUNNER_TEMP/gitleaks_checksums.txt" | sha256sum -c - )
          tar -xzf "$RUNNER_TEMP/gitleaks-dl/${BASE}" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          if [ "${{ matrix.lane }}" = guards ]; then
            bash scripts/test-gitleaks-config.sh
            bash scripts/scan-worktree-secrets.sh
            gitleaks git . --redact --no-banner --log-opts="origin/master..HEAD"
            bash scripts/ci-local-e2e-smoke.sh
          fi
      - name: Fetch the pinned source-native QA recorders
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gstack-qa-tools"
          git -C "$RUNNER_TEMP/gstack-qa-tools" init -q
          git -C "$RUNNER_TEMP/gstack-qa-tools" fetch --depth 1 https://github.com/garrytan/gstack.git 8781d9c0a972068e2ee0e5597eb2f3482788355a
          git -C "$RUNNER_TEMP/gstack-qa-tools" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/gstack-qa-tools" rev-parse HEAD)" = 8781d9c0a972068e2ee0e5597eb2f3482788355a
          test "$(cat "$RUNNER_TEMP/gstack-qa-tools/VERSION")" = 1.94.35.0
      - name: Prepare disposable native CI tools and databases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-build-context" "$RUNNER_TEMP/native-results"
          chmod 0777 "$RUNNER_TEMP/native-results"
          docker build -t oven/bun:contribution-1.4.4-curl -f - "$RUNNER_TEMP/empty-build-context" <<'DOCKERFILE'
          FROM oven/bun:1.4.4
          USER root
          RUN apt-get update -qq && apt-get install -y -qq git ca-certificates python3 procps postgresql-client jq build-essential curl
          RUN groupadd --gid 1001 ci-test && useradd --uid 1001 --gid 1001 --create-home ci-test
          DOCKERFILE
          docker compose -f docker-compose.ci.yml pull postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
          docker compose -f docker-compose.ci.yml up -d postgres-1 postgres-2 postgres-3 postgres-4 pgbouncer
          docker compose -f docker-compose.ci.yml run --rm runner bash -ec '
            git config --global --add safe.directory "*"
            bash scripts/ci-hydrate-admin-dist.sh /ci-src/admin-dist admin/dist
            bun install --frozen-lockfile
            bun run build
            bun run build:pglite-snapshot
            bun scripts/lib/ensure-e2e-database.ts postgresql://postgres:postgres@postgres-1:5432/gbrain_test gbrain_ci_admin_test
            chown -R 1001:1001 /app
          '
      - name: Execute the unchanged native lane as UID1001
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/native-lane.sh" <<'NATIVE_LANE'
          set -euo pipefail
          export HOME=/home/ci-test
          test "$(id -u)" = 1001
          test "$(git rev-parse HEAD)" = 31c5a41ba9103590f2c2922434b8f15c9b55f380
          git status --short
          export GBRAIN_SKIP_STARTUP_HOOKS=1
          export GBRAIN_PGLITE_SNAPSHOT=test/fixtures/pglite-snapshot.tar
          export GBRAIN_TEST_RECEIPT_DIR=/ci-results/receipts
          ./bin/gbrain --version
          test "$CI_NATIVE_LANE" = qa
          export GSTACK_ROOT=/qa-tools
          # These are metadata readiness checks, before the single smoke clock.
          bun --no-env-file --config=/dev/null /qa-tools/bin/gstack-qa-deadline --help
          bun --no-env-file --config=/dev/null /qa-tools/bin/gstack-qa-evidence --help
          mkdir -p /ci-results/qa
          chmod 0700 /ci-results/qa
          cat > /ci-results/qa/charter.md <<'QA_CHARTER'
          # CLI daemon QA charter
          Frozen source31c5a41ba; caller /ship. Functional CLI/worker smoke only.
          Repaired prerequisite: source-native gstack QA recorder/guard now available.
          One existing native real-daemon integration test, not another full corpus.
          Contract: registered non-default source gets its own source/full stamps,
          full maintenance retains its fixture purge effect, unregistered repo leaves
          every source stamp unchanged. The native test asserts those durable effects
          after real daemon termination, not merely enqueue/launch acceptance.
          Fixture: synthetic temp HOME/GBRAIN_HOME and on-disk PGLite; explicit env
          allowlist, no operator/provider credentials, no production destinations.
          Reads: full existing test before launch; fixture payload is public/synthetic.
          Writes: owned native temp fixture, native JUnit and this QA directory only.
          Exit condition: exactly one test executes and passes, no failure/skip,
          native capture status complete, original test150s bound unchanged.
          Smoke guard:300s/one probe(max12), starts after dependencies are prepared.
          No discovery checkpoint is needed unless another probe is selected.
          Limits: integration-test evidence, not production/live providers, real
          Postgres daemon contention, shutdown during resolution or macOS coverage.
          Cleanup: native test owns and removes its temp fixture; preserve QA before
          disposing only this job's container stack. No new product test or code edit.
          QA_CHARTER
          bun --no-env-file --config=/dev/null /qa-tools/bin/gstack-qa-deadline start /ci-results/qa/deadline.json 300
          bun --no-env-file --config=/dev/null /qa-tools/bin/gstack-qa-evidence capture /ci-results/qa 001 --public --deadline /ci-results/qa/deadline.json -- \
            env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun --no-env-file --config=/dev/null test test/autopilot-inline-source-freshness.serial.test.ts --reporter=junit --reporter-outfile=/ci-results/qa/daemon.junit.xml
          python3 - <<'QA_VERIFY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          root = ET.parse('/ci-results/qa/daemon.junit.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 1 and not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped')
          annotations = {'evidence': [{'capture': '001',
              'command': 'env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun --no-env-file --config=/dev/null test test/autopilot-inline-source-freshness.serial.test.ts --reporter=junit --reporter-outfile=/ci-results/qa/daemon.junit.xml',
              'contract': 'Real CLI registered-source/full-maintenance success and unmatched-source no-effect edge',
              'expected': 'Exactly1native real-daemon test passes, nofailures/errors/skips; its16assertions include persistedsource/fullstamps,purgeeffectandall-sourceunchangedstamps',
              'classification': 'pass'}],
              'limits': ['One invocation-local guarded integration-test probe, not production acceptance',
                         'No Postgres daemon contention, shutdown-during-resolution, liveprovider or macOS claim',
                         'Durable fixture effects are asserted inside the real-daemon test; raw DB snapshots are not exported']}
          Path('/ci-results/qa/annotations.json').write_text(json.dumps(annotations, indent=2))
          QA_VERIFY
          bun --no-env-file --config=/dev/null /qa-tools/bin/gstack-qa-evidence materialize /ci-results/qa /ci-results/qa/annotations.json
          git diff --exit-code -- src/commands/autopilot-daemon.ts test/autopilot-inline-source-freshness.serial.test.ts scripts/serial-files.tsv
          NATIVE_LANE
          set +e
          docker compose -f docker-compose.ci.yml run --rm --user 1001:1001 \
            -e CI=true -e CI_NATIVE_LANE="${{ matrix.lane }}" -e CI_NATIVE_SHARD="${{ matrix.shard }}" \
            -e GITHUB_SHA=31c5a41ba9103590f2c2922434b8f15c9b55f380 \
            -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v /usr/local/bin/gitleaks:/usr/local/bin/gitleaks:ro \
            -v "$RUNNER_TEMP/gstack-qa-tools:/qa-tools:ro" \
            -v "$RUNNER_TEMP/native-lane.sh:/native-lane.sh:ro" \
            -v "$RUNNER_TEMP/native-results:/ci-results" \
            runner bash /native-lane.sh 2>&1 | tee "$RUNNER_TEMP/native-results/lane.log"
          pipeline_rc=("${PIPESTATUS[@]}")
          native_rc=${pipeline_rc[0]}
          log_rc=${pipeline_rc[1]}
          set -e
          printf '{"lane":"%s","shard":%s,"native_exit":%s,"log_exit":%s}\n' '${{ matrix.lane }}' '${{ matrix.shard }}' "$native_rc" "$log_rc" \
            | tee "$RUNNER_TEMP/native-results/result.json"
          if [ "$native_rc" -eq 0 ] && [ "$log_rc" -ne 0 ]; then exit "$log_rc"; fi
          exit "$native_rc"
      - name: Preserve native receipts in job logs without artifact or cache uploads
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-results"
          # Exact native JUnit, assigned-file lists, receipts and exit metadata.
          # Full lane output is already retained in the standard job log.
          paths=()
          test ! -d receipts || paths+=(receipts)
          test ! -f result.json || paths+=(result.json)
          for name in qa; do
            test ! -e "$name" || paths+=("$name")
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            tar -czf "$RUNNER_TEMP/native-receipts.tar.gz" "${paths[@]}"
            sha256sum "$RUNNER_TEMP/native-receipts.tar.gz"
            wc -c "$RUNNER_TEMP/native-receipts.tar.gz"
            echo "NATIVE_RECEIPTS_BASE64_BEGIN"
            base64 -w 100 "$RUNNER_TEMP/native-receipts.tar.gz"
            echo "NATIVE_RECEIPTS_BASE64_END"
          else
            echo "NATIVE_RECEIPTS_MISSING: no native invocation receipt or exit metadata"
          fi
      - name: Stop only this disposable test stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
