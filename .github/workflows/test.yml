name: Exact candidate PostgreSQL fixture correction only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair-pregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gbrain
          ref: deef2593dc3717907a1f17d7db6eb558747bfc0f
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gstack
          ref: 8781d9c0a972068e2ee0e5597eb2f3482788355a
          persist-credentials: false
          path: tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Apply exact candidate and bind all eleven authored file hashes
        working-directory: candidate
        env:
          PATCH_GZIP: 
          PATCH_SHA: 1e51ecf09f2d9b0d2f28bfcb5a5bac27494ebab784d679dfe0f3f54c79178e86
          FILE_HASHES: '{"CHANGELOG.md":"f0bcf2638ec0d5092173db1f52d3bd6f0fd84e576689bacebffe8d6441531912","docs/architecture/canonical-writers.tsv":"57b5b99e2fd5a49eb5abb70e509ddbd43e1bb1995ac1250cc788a10590a62f93","docs/architecture/key-files/core-utilities-2.md":"3a114270071fb3ea2de955fed6751b7f0b176a7e24ad3eb3d8605c00306be83c","docs/architecture/system-of-record.md":"cdc469f75f96c66ae50603ae231344ebf4b02268884ac1ae18391234e4d5b677","docs/guides/repair.md":"a6b4d06fafa4cf2a87a929075ec89b53c00731c8c142c61f6a1f36a42f9e44da","src/core/cycle/extract-facts.ts":"06bade915616a9273e51f7ec5a41c86d636293e49bbe9c96ccf1532439acb2d8","src/core/persistence/prepared-maintenance.ts":"aaaaf014f416f4ef771913adb56f128377786264e5aff4cffe71409c84f8f4b5","src/core/repair/failed-writes.ts":"f48bcee8e981879a4afd9ca9c4ffa5240c55c5f51d3e4568ae9d53c7bccdc79b","src/core/repair/redacted-facts.ts":"5cb841fc1024249a9ff6deb68f680bcb7c2d6ecac35aaa6a1fcc4ee48323ba65","test/facts-entity-moved-7602.test.ts":"ef2df985e6d18d3f312cead0f8f313fce7514c6f2b487b1eeba5ae19c4141e7b","test/repair-redacted-facts.test.ts":"d160bb161a94257ac2cf7a601c638b9690faf6062ae8bbefde71e5ce8e15d98e"}'
        run: |
          python3 - <<'PYCODE'
          import os,gzip,base64,json,hashlib,subprocess,pathlib
          p=gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP']))
          assert hashlib.sha256(p).hexdigest()==os.environ['PATCH_SHA']
          subprocess.run(['git','apply','--check','-'],input=p,check=True)
          subprocess.run(['git','apply','-'],input=p,check=True)
          for f,h in json.loads(os.environ['FILE_HASHES']).items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidate-input-manifest.json').write_text(os.environ['FILE_HASHES'])
          PYCODE
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git update-ref refs/remotes/origin/master deef2593dc3717907a1f17d7db6eb558747bfc0f
          git config user.name 'Source verification'
          git config user.email 'verification@users.noreply.github.com'
          git add -u
          git commit -m 'Ephemeral exact candidate for offhost verification'
          git rev-parse HEAD^{tree}
      - name: Install pinned source dependencies on disposable runner
        run: |
          (cd tools && bun install --frozen-lockfile)
          (cd candidate && bun install --frozen-lockfile)
      - name: Native stage-one pregate on exact candidate
        if: ${{ false }}
        working-directory: candidate
        env:
          GSTACK_ACTIVE_HOST: codex
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          ../tools/bin/gstack-pregate run --stage preflight --base master --allow-repo-commands --json > "$RUNNER_TEMP/receipts/pregate-preflight.json" 2> "$RUNNER_TEMP/receipts/pregate-preflight.stderr.log"
      - name: Fresh declared documentation, type and native verify checks
        if: ${{ false }}
        working-directory: candidate
        run: |
          set -o pipefail
          bun run check:doc-history 2>&1 | tee "$RUNNER_TEMP/receipts/doc-history.log"
          bun run check:page-body-readers 2>&1 | tee "$RUNNER_TEMP/receipts/page-body-readers.log"
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/receipts/typecheck.log"
          bun run verify 2>&1 | tee "$RUNNER_TEMP/receipts/verify.log"
      - name: Existing focused PGLite and caller-chain regressions
        if: ${{ false }}
        working-directory: candidate
        run: |
          ../tools/bin/gstack-evidence run --label tests -- bun test --timeout=180000 test/repair-redacted-facts.test.ts test/facts-entity-moved-7602.test.ts test/repair-apply-continue-6459.test.ts
      - name: Existing focused PostgreSQL regressions
        working-directory: candidate
        env:
          GBRAIN_TEST_ALLOW_DATABASE_URL: '1'
          GBRAIN_TEST_BACKEND: postgres-direct
          GBRAIN_TEST_DB: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gbrain_test
        run: |
          ../tools/bin/gstack-evidence run --label postgres-focused -- bun test --timeout=180000 test/repair-redacted-facts.test.ts test/facts-entity-moved-7602.test.ts test/repair-apply-continue-6459.test.ts
      - name: Bundle native evidence and exact manifest
        if: always()
        working-directory: candidate
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          cp "$RUNNER_TEMP/candidate-input-manifest.json" "$RUNNER_TEMP/receipts/"
          ../tools/bin/gstack-evidence bundle --out "$RUNNER_TEMP/receipts/evidence-bundle.json" --label postgres-focused --base master || true
          cp -a .gstack/tmp "$RUNNER_TEMP/receipts/candidate-gstack-tmp" || true
          cp -a "$HOME/.gstack/projects" "$RUNNER_TEMP/receipts/native-evidence-projects" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-postdoc-postgres-fixture-receipts
          path: ${{ runner.temp }}/receipts/
          retention-days: 7
