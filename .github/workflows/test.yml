name: Build compatible native gstack tooling offhost
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gstack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GSTACK_SKIP_PLAYWRIGHT: '1'
      GSTACK_SKIP_FONTS: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gstack
          ref: 8781d9c0a972068e2ee0e5597eb2f3482788355a
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Build the exact compatible stock release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8781d9c0a972068e2ee0e5597eb2f3482788355a
          test "$(cat VERSION)" = 1.94.35.0
          bun install --frozen-lockfile
          bun run build
          mkdir -p "$RUNNER_TEMP/gstack-compatible"
          tar -czf "$RUNNER_TEMP/gstack-compatible/runtime.tar.gz" bin browse/dist design/dist make-pdf/dist
          sha256sum "$RUNNER_TEMP/gstack-compatible/runtime.tar.gz" > "$RUNNER_TEMP/gstack-compatible/runtime.sha256"
          python3 - <<'PYCODE'
          import pathlib,json,hashlib,subprocess,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'gstack-compatible'
          d={'source_sha':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'version':pathlib.Path('VERSION').read_text().strip(),'bun':subprocess.check_output(['bun','--version']).decode().strip(),'archive_sha256':hashlib.sha256((p/'runtime.tar.gz').read_bytes()).hexdigest(),'archive_bytes':(p/'runtime.tar.gz').stat().st_size,'native_command':'bun install --frozen-lockfile; bun run build','built_offhost':True}
          (p/'manifest.json').write_text(json.dumps(d,indent=2));print(json.dumps(d))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: gstack-compatible-1.94.35-linux
          path: ${{ runner.temp }}/gstack-compatible/
          retention-days: 1
