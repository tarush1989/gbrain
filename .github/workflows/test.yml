name: Exact native ship preparation offhost
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GBRAIN_SKIP_STARTUP_HOOKS: '1'
      GSTACK_SESSION_KIND: unattended
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gbrain
          ref: deef2593dc3717907a1f17d7db6eb558747bfc0f
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: garrytan/gstack
          ref: 8781d9c0a972068e2ee0e5597eb2f3482788355a
          persist-credentials: false
          path: tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Restore exact original source objects and authentic docs snapshot
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-preparation"
          curl -fsSL 'https://raw.githubusercontent.com/tarush1989/gbrain/23a01d01a7cfd02da066de49b9c62d2460142fea/contributions/native-ship-preparation-20261107.inputs.json.gz' -o "$RUNNER_TEMP/native-preparation/inputs.json.gz"
          python3 - <<'PYINPUT'
          import pathlib,hashlib,gzip,json,base64,subprocess,os
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-preparation'
          data=(r/'inputs.json.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='ee1907a8739948acf9834553be492423b0eb3e1a43287363b4f1a5c50447b47a'
          d=json.loads(gzip.decompress(data));pack=base64.b64decode(d['pack_b64'])
          assert hashlib.sha256(pack).hexdigest()==d['pack_sha256']
          subprocess.run(['git','index-pack','--fix-thin','--stdin'],input=pack,check=True)
          subprocess.run(['git','checkout','-B','codex/repair-redacted-legacy-20261107',d['head']],check=True)
          subprocess.run(['git','update-ref','refs/remotes/origin/master',d['policy_base']],check=True)
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==d['head']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()=='f1a1ecf328a28f7a4c5d2db2898e776ff3553377'
          assert subprocess.check_output(['git','cat-file','-t',d['reviewed_tree']]).decode().strip()=='tree'
          patch=subprocess.check_output(['git','diff','--binary',d['reviewed_base'],'HEAD'])
          assert hashlib.sha256(patch).hexdigest()==d['source_patch_sha256']
          docs=gzip.decompress(base64.b64decode(d['docs_post_gzip']))
          assert hashlib.sha256(docs).hexdigest()==d['docs_post_sha256']
          (r/'docs-post.json').write_bytes(docs)
          (r/'bindings.json').write_text(json.dumps({k:v for k,v in d.items() if k not in ['pack_b64','docs_post_gzip']},indent=2))
          print(json.dumps({'source_head':d['head'],'source_tree':'f1a1ecf328a28f7a4c5d2db2898e776ff3553377','source_patch_sha256':d['source_patch_sha256'],'policy_base':d['policy_base'],'original_docs_snapshot_sha256':d['docs_post_sha256']}))
          PYINPUT
          git config user.name 'Tarush Aggarwal'
          git config user.email 'tarush@teio.ai'
      - name: Install exact source and tooling dependencies only on disposable runner
        run: |
          set -euo pipefail
          ( cd tools && bun install --frozen-lockfile )
          ( cd candidate && bun install --frozen-lockfile )
      - name: Run unchanged native finish with mapped test lanes deferred to CI
        working-directory: candidate
        run: |
          set -uo pipefail
          ../tools/bin/gstack-ship-release finish             --base master             --reviewed-tree 5d1f0df845d4e39b0625d58fd056a3f2671a6ec1             --reviewed-base deef2593dc3717907a1f17d7db6eb558747bfc0f             --docs-post "$RUNNER_TEMP/native-preparation/docs-post.json"             --docs-rechecked             --build 'bun run build'             --lane 'tests=bun run test'             --lane 'serial=bun run test:serial'             --lane 'slow=bun run test:slow'             --lane 'e2e=bun run test:e2e'             --trailer 'Co-Authored-By: Claude <noreply@anthropic.com>'             2>&1 | tee "$RUNNER_TEMP/native-preparation/native-finish.log"
          codes=("${PIPESTATUS[@]}")
          native_rc=${codes[0]}
          log_rc=${codes[1]}
          printf '{"native_exit":%s,"log_exit":%s}\n' "$native_rc" "$log_rc" > "$RUNNER_TEMP/native-preparation/result.json"
          if [ "$native_rc" -eq 0 ] && [ "$log_rc" -ne 0 ]; then exit "$log_rc"; fi
          exit "$native_rc"
      - name: Retain complete native preparation receipts in standard job log
        if: always()
        working-directory: candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-preparation"
          mkdir -p "$out/receipts"
          for name in pregate-finish-preflight.json pregate.json; do
            file=$(git rev-parse --git-path "gstack/$name")
            test ! -f "$file" || cp "$file" "$out/receipts/$name"
          done
          git status --porcelain > "$out/receipts/source-status.txt"
          git rev-parse HEAD HEAD^{tree} > "$out/receipts/source-head-tree.txt"
          git diff --binary deef2593dc3717907a1f17d7db6eb558747bfc0f > "$out/receipts/source-current.patch"
          sha256sum "$out/receipts/source-current.patch"
          test ! -d "$HOME/.gstack/projects/garrytan-gbrain/pregate" || cp -a "$HOME/.gstack/projects/garrytan-gbrain/pregate" "$out/receipts/pregate-native"
          tar -czf "$RUNNER_TEMP/native-preparation-receipts.tar.gz" -C "$out" bindings.json docs-post.json receipts native-finish.log result.json
          sha256sum "$RUNNER_TEMP/native-preparation-receipts.tar.gz"
          wc -c "$RUNNER_TEMP/native-preparation-receipts.tar.gz"
          echo NATIVE_PREPARATION_RECEIPTS_BASE64_BEGIN
          base64 -w 100 "$RUNNER_TEMP/native-preparation-receipts.tar.gz"
          echo NATIVE_PREPARATION_RECEIPTS_BASE64_END
