name: Inline review focused negative-control QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GBRAIN_CI_BUN_TAG: contribution-1.4.4-curl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tarush1989/gbrain
          ref: ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Bind exact source and pinned base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7
          git remote set-url origin https://github.com/garrytan/gbrain.git
          git fetch origin 333dd1bdcd47d70808a82fb52d2f493fea460b17:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = 333dd1bdcd47d70808a82fb52d2f493fea460b17
          test -z "$(git status --porcelain)"
          sha256sum src/commands/autopilot-daemon.ts test/autopilot-inline-source-freshness.serial.test.ts src/core/cycle.ts
          git show 333dd1bdcd47d70808a82fb52d2f493fea460b17:src/commands/autopilot-daemon.ts | sha256sum
          test "$(id -u)" = 1001
      - name: Prepare disposable native runner (no databases, no credentials)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-build-context" "$RUNNER_TEMP/native-results"
          chmod 0777 "$RUNNER_TEMP/native-results"
          docker build -t oven/bun:contribution-1.4.4-curl -f - "$RUNNER_TEMP/empty-build-context" <<'DOCKERFILE'
          FROM oven/bun:1.4.4
          USER root
          RUN apt-get update -qq && apt-get install -y -qq git ca-certificates python3 procps postgresql-client jq build-essential curl
          RUN groupadd --gid 1001 ci-test && useradd --uid 1001 --gid 1001 --create-home ci-test
          DOCKERFILE
          docker compose -f docker-compose.ci.yml run --rm --no-deps runner bash -ec '
            git config --global --add safe.directory "*"
            bash scripts/ci-hydrate-admin-dist.sh /ci-src/admin-dist admin/dist
            bun install --frozen-lockfile
            bun run build
            bun run build:pglite-snapshot
            chown -R 1001:1001 /app
          '
      - name: Run paired positive control and two negative controls as UID1001
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/focused.sh" <<'FOCUSED'
          set -uo pipefail
          export HOME=/home/ci-test
          git config --global --add safe.directory "*"
          test "$(id -u)" = 1001 || exit 2
          test "$(git rev-parse HEAD)" = ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7 || exit 2
          export GBRAIN_SKIP_STARTUP_HOOKS=1
          export GBRAIN_PGLITE_SNAPSHOT=test/fixtures/pglite-snapshot.tar
          T=test/autopilot-inline-source-freshness.serial.test.ts
          F=src/commands/autopilot-daemon.ts
          BASE=333dd1bdcd47d70808a82fb52d2f493fea460b17
          run_variant() {
            v="$1"
            echo "=== VARIANT $v BEGIN"
            git diff --stat; sha256sum "$F" "$T" src/core/cycle.ts
            git diff -- "$F" | head -80
            mkdir -p "/ci-results/receipts-$v"
            env -u DATABASE_URL -u GBRAIN_DATABASE_URL GBRAIN_TEST_RECEIPT_DIR="/ci-results/receipts-$v" \
              bash scripts/run-serial-tests.sh "$T" > "/ci-results/$v.log" 2>&1
            rc=$?
            cat "/ci-results/$v.log"
            echo "=== VARIANT $v EXIT $rc"
            echo "$rc" > "/ci-results/$v.rc"
            git checkout -- "$F"
            test -z "$(git status --porcelain -- src test)" || { echo "restore failed"; exit 3; }
          }
          # A: intact ecd0 paired positive control.
          run_variant A
          # B: base daemon restored over current fixture/core.
          git show "$BASE:$F" > "$F"
          run_variant B
          # C: only the fullImplicitSourceCycle:true line removed.
          sed -i '636{/^ *fullImplicitSourceCycle: true,$/d}' "$F"
          test "$(grep -c fullImplicitSourceCycle "$F")" = 0 || exit 4
          test "$(git diff --numstat -- "$F")" = "$(printf '0\t1\t%s' "$F")" || exit 4
          run_variant C
          a=$(cat /ci-results/A.rc); b=$(cat /ci-results/B.rc); c=$(cat /ci-results/C.rc)
          b96=$(grep -c "autopilot-inline-source-freshness.serial.test.ts:96:" /ci-results/B.log || true)
          c98=$(grep -c "autopilot-inline-source-freshness.serial.test.ts:98:" /ci-results/C.log || true)
          c96=$(grep -c "autopilot-inline-source-freshness.serial.test.ts:96:" /ci-results/C.log || true)
          printf '{"A_exit":%s,"B_exit":%s,"C_exit":%s,"B_line96_hits":%s,"C_line98_hits":%s,"C_line96_hits":%s}\n' "$a" "$b" "$c" "$b96" "$c98" "$c96" | tee /ci-results/result.json
          [ "$a" = 0 ] && [ "$b" != 0 ] && [ "$b96" -gt 0 ] && [ "$c" != 0 ] && [ "$c98" -gt 0 ] && [ "$c96" = 0 ]
          FOCUSED
          docker compose -f docker-compose.ci.yml run --rm --no-deps --user 1001:1001 \
            -e CI=true -e GITHUB_SHA=ecd0ee2f69895173bb6a80d78da27e5aef5ab0a7 -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -v "$RUNNER_TEMP/focused.sh:/focused.sh:ro" \
            -v "$RUNNER_TEMP/native-results:/ci-results" \
            runner bash /focused.sh
      - name: Preserve receipts in job log without artifact or cache uploads
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/native-results"
          ls -la
          tar -czf "$RUNNER_TEMP/focused-receipts.tar.gz" .
          sha256sum "$RUNNER_TEMP/focused-receipts.tar.gz"
          echo "FOCUSED_RECEIPTS_BASE64_BEGIN"
          base64 -w 100 "$RUNNER_TEMP/focused-receipts.tar.gz"
          echo "FOCUSED_RECEIPTS_BASE64_END"
      - name: Stop only this disposable stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --remove-orphans
